<!-- MI-CURSO:INICIO · componente autocontenido (fuente: componentes/mi-curso.html · se inyecta con componentes/inyectar.py) -->
<style id="mi-curso-css">
.mc{--a:#2e7d32;--a2:#12421a;--dark:#0c2410;--gold:#f0b429;--gold2:#d99a06;--bg:#f5f6f2;--card:#fff;--ink:#131f16;--soft:#48604f;--mute:#7e9185;--line:rgba(19,31,22,.09);--line2:rgba(19,31,22,.14);--ok:#1e8e3e;
  position:fixed;inset:0;z-index:2147483000;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.mc[hidden]{display:none!important}.mc *{box-sizing:border-box}.mc [hidden]{display:none!important}
:where(.mc) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
:where(.mc) svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:where(.mc) :is(h1,h2,h3){margin:0;font-family:'Archivo','Inter',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.15}
:where(.mc) p{margin:0}
/* ── Materiales · cards editoriales ── */
.mc__mhero{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px 22px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,rgba(240,180,41,.22),transparent 55%),linear-gradient(150deg,#123f1a 0%,#0c2410 62%,#081a0b 100%);box-shadow:0 18px 40px -22px rgba(12,36,16,.7)}
.mc__mhero h2{font-family:'Archivo',sans-serif;font-size:clamp(1.55rem,5.4vw,2.05rem);line-height:1.04;letter-spacing:-.025em;font-weight:800;max-width:15ch}
.mc__mhero p{margin-top:10px;font-size:.9rem;line-height:1.5;color:rgba(255,255,255,.78);max-width:46ch}
.mc__mhero .chk{display:flex;gap:9px;align-items:flex-start;margin-top:16px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.92)}
.mc__mhero .chk svg{width:16px;height:16px;flex:none;color:#7ee08a;margin-top:1px}
.mc__mhero .box{margin-top:18px;padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:14px}
.mc__mhero .box b{font-family:'Archivo',sans-serif;font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.mc__mhero .box small{display:block;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:800}
.mc__mhero .box span{font-size:.78rem;color:rgba(255,255,255,.75)}
.mc__mhead{margin:26px 0 4px}
.mc__mhead h2{font-family:'Archivo',sans-serif;font-size:1.32rem;font-weight:800;letter-spacing:-.02em}
.mc__mhead p{font-size:.84rem;color:var(--soft);margin-top:4px;line-height:1.45}
.mc__mcount{display:block;margin:16px 0 10px;font-size:.78rem;font-weight:800;color:var(--mute)}
.mc__mgrid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){.mc__mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1180px){.mc__mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc__mc{display:flex;flex-direction:column;background:var(--card);border:1.5px solid rgba(19,31,22,.13);border-radius:22px;overflow:hidden;box-shadow:0 10px 26px -20px rgba(12,36,16,.5);transition:transform .18s,box-shadow .18s}
.mc__mc:hover{transform:translateY(-2px);box-shadow:0 18px 34px -20px rgba(12,36,16,.55)}
.mc__mcov{position:relative;display:block;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#e8efe6,#d5e3d3);overflow:hidden}
.mc__mcov img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.mc__mc:hover .mc__mcov img{transform:scale(1.035)}
.mc__mcov .tag{position:absolute;top:14px;left:14px;padding:7px 13px;border-radius:999px;background:#fff;color:#1c2a20;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 4px 12px -6px rgba(0,0,0,.35)}
.mc__mcov .num{position:absolute;top:14px;right:14px;padding:7px 12px;border-radius:999px;background:rgba(12,36,16,.82);color:#fff;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:.62rem;font-weight:700;letter-spacing:.14em;backdrop-filter:blur(6px)}
.mc__mcov .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--a)}
.mc__mcov .ph svg{width:46px;height:46px;opacity:.55}
.mc__mbody{display:flex;flex-direction:column;flex:1;padding:20px 22px 20px}
.mc__mcat{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a)}
.mc__mbody h3{font-family:'Archivo',sans-serif;font-size:1.13rem;line-height:1.28;font-weight:800;letter-spacing:-.012em;margin-top:9px;color:var(--ink)}
.mc__mbody p{font-size:.88rem;line-height:1.55;color:var(--soft);margin-top:9px;flex:1}
.mc__mfol{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.76rem;color:var(--mute)}
.mc__mfol svg{width:15px;height:15px;flex:none}
.mc__mfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.mc__mown{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:800;color:var(--ink)}
.mc__mown svg{width:17px;height:17px;stroke-width:2.6}
.mc__mopen{min-height:46px;padding:0 30px;border-radius:13px;background:linear-gradient(180deg,#22874a,#176b38);color:#fff;font-weight:800;font-size:.92rem;box-shadow:0 10px 20px -10px rgba(23,107,56,.8);transition:transform .15s,filter .15s}
.mc__mopen:hover{filter:brightness(1.06)}.mc__mopen:active{transform:scale(.97)}
.mc__mnote{display:flex;gap:10px;margin-top:18px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:.78rem;line-height:1.5;color:var(--mute)}
.mc__mnote svg{width:17px;height:17px;flex:none;color:var(--a);margin-top:1px}
/* ── Topbar ── */
.mc__top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.mc__brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mc__brand>div{min-width:0}
.mc__brand img{width:auto;height:36px;max-width:112px;border-radius:0;object-fit:contain;flex:none}
.mc__brand b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc__brand small{display:block;font-size:.66rem;color:var(--a);text-transform:uppercase;letter-spacing:.1em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc__me{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;font-weight:800;font-size:.85rem;box-shadow:0 4px 12px rgba(18,66,26,.25);flex:none}
.mc.solo .mc__me{display:none}
.mc__me.on{box-shadow:0 0 0 3px rgba(240,180,41,.6)}
.mc__x{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600;font-size:.84rem;flex:none}
.mc__x:hover{border-color:var(--a);color:var(--a)}
.mc__x svg{width:15px;height:15px}
/* ── Layout ── */
.mc__shell{flex:1;display:flex;min-height:0}
.mc__side{flex:none;width:226px;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.mc__glabel{font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:14px 10px 6px}
.mc__glabel:first-child{padding-top:2px}
.mc__ni{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:9px 11px;border-radius:11px;font-size:.84rem;font-weight:550;color:var(--soft);text-decoration:none;transition:background .15s,color .15s}
.mc__ni svg{width:16px;height:16px}
.mc__ni:hover{background:var(--bg);color:var(--ink)}
.mc__ni.on{background:linear-gradient(90deg,rgba(46,125,50,.14),rgba(46,125,50,.04));color:var(--a);font-weight:700;box-shadow:inset 0 0 0 1px rgba(46,125,50,.14)}
.mc__ni.on::before{content:'';position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 4px 4px 0;background:var(--a)}
.mc__side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.mc__main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mc__wrap{max-width:1040px;margin:0 auto;padding:24px 22px calc(46px + env(safe-area-inset-bottom))}
/* ── Cápsula inferior (teléfono) ── */
.mc__tabs{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;display:none;width:min(560px,calc(100% - 24px));padding:6px;border-radius:24px;border:1px solid rgba(19,31,22,.1);background:rgba(255,255,255,.88);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 44px rgba(12,36,16,.2),0 2px 6px rgba(12,36,16,.06);justify-content:space-between;gap:4px}
.mc__tab{position:relative;flex:1 1 0;min-width:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:18px;font-size:.64rem;font-weight:700;letter-spacing:.01em;color:var(--mute);transition:color .2s,background .25s}
.mc__tab svg{width:21px;height:21px;transition:transform .25s}
.mc__tab.on{color:var(--a);background:linear-gradient(180deg,rgba(46,125,50,.13),rgba(46,125,50,.06))}
.mc__tab.on svg{transform:translateY(-1px) scale(1.06)}
.mc__tab .dot{position:absolute;top:7px;right:calc(50% - 17px);width:8px;height:8px;border-radius:50%;background:#e53935;border:2px solid #fff}
/* ── Comunes ── */
.mc__btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border-radius:13px;font-weight:700;font-size:.92rem;text-decoration:none;transition:transform .15s,box-shadow .15s;text-align:center}
.mc__btn:active{transform:scale(.98)}
.mc__btn--p{background:linear-gradient(180deg,var(--a),var(--a2));color:#fff!important;box-shadow:0 8px 18px -8px rgba(18,66,26,.5)}
.mc__btn--g{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#231a02!important;box-shadow:0 8px 18px -8px rgba(217,154,6,.55)}
.mc__btn--d{background:var(--dark);color:#fff!important}
.mc__btn--l{background:var(--card);color:var(--ink)!important;border:1px solid var(--line2)}
.mc__btn--google{width:100%;background:#fff;color:#1f2937!important;border:1px solid #dadce0}
.mc__btn[disabled]{opacity:.55;cursor:not-allowed}
.mc__btn--sm{min-height:38px;padding:0 14px;font-size:.82rem;border-radius:11px}
.mc__link{color:var(--a);font-weight:650;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
.mc__card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(12,36,16,.03),0 10px 30px -18px rgba(12,36,16,.14)}
.mc__chip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border-radius:999px;font-size:.72rem;font-weight:700;background:#edf1ec;color:var(--soft);white-space:nowrap}
.mc__chip svg{width:13px;height:13px}
.mc__chip--ok{background:#e2f3e5;color:#166534}.mc__chip--pend{background:#fdf3d7;color:#8a6200}.mc__chip--gold{background:rgba(240,180,41,.2);color:#7a5600}.mc__chip--line{background:transparent;border:1px solid var(--line2)}
.mc__eyebrow{display:block;font-size:.62rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--a)}
.mc__eyebrow.mute{color:var(--mute)}
.mc__sh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 14px}
.mc__sh h2{font-size:clamp(1.12rem,2.1vw,1.38rem);margin-top:5px}
.mc__sh>b{padding:6px 11px;border-radius:999px;background:rgba(46,125,50,.09);color:var(--a);font-size:.72rem;font-weight:750;white-space:nowrap;flex:none}
.mc__sec{margin-top:30px}
.mc__bar{height:7px;border-radius:999px;background:#e7ebe6;overflow:hidden}
.mc__bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--a),#4caf50);transition:width .4s}
.mc__spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--gold);animation:mcspin .8s linear infinite}
.mc__spin--d{border-color:var(--line);border-top-color:var(--a);margin:60px auto}
@keyframes mcspin{to{transform:rotate(360deg)}}
.mc__ring{--p:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--a) calc(var(--p)*1%),#e7ebe6 0);flex:none}
.mc__ring>div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.15rem;line-height:1;font-family:'Archivo',sans-serif}
.mc__ring small{display:block;font-size:.58rem;font-weight:600;color:var(--mute);margin-top:3px}
.mc__st{color:var(--gold2);letter-spacing:1.5px;font-size:.95rem;white-space:nowrap}
.mc__st i{font-style:normal;opacity:.26}
/* ── Acceso / vacíos ── */
.mc__auth{max-width:420px;margin:26px auto;padding:28px 24px}
.mc__auth h2{font-size:1.4rem;margin-bottom:6px}
.mc__auth .mc__sub{color:var(--soft);font-size:.9rem;line-height:1.5;margin-bottom:18px}
.mc__sep{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:.76rem;margin:16px 0}
.mc__sep:before,.mc__sep:after{content:'';flex:1;height:1px;background:var(--line)}
.mc__field{display:grid;gap:6px;margin-bottom:12px;font-size:.8rem;font-weight:650;color:var(--soft)}
.mc__field input,.mc__field select,.mc__field textarea{width:100%;min-width:0;border-radius:12px;border:1px solid var(--line2);background:var(--bg);padding:0 14px;font:inherit;font-size:1rem;color:var(--ink)}
.mc__field input,.mc__field select{height:46px}
.mc__field textarea{padding:12px 14px;min-height:78px;resize:vertical}
.mc__field :is(input,select,textarea):focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(46,125,50,.14)}
.mc__field small{font-weight:500;color:var(--mute);font-size:.72rem}
.mc__opt{font-weight:500;color:var(--mute)}
.mc__msg{font-size:.84rem;border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fdecea;color:#8a1c13;line-height:1.45}
.mc__msg.ok{background:#e8f5e9;color:#12421a}
.mc__links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.mc__help{margin-top:16px;font-size:.78rem;color:var(--mute);line-height:1.5}
.mc__empty{max-width:520px;margin:30px auto;padding:30px 24px;text-align:center}
.mc__empty h2{font-size:1.25rem;margin:10px 0 8px}
.mc__empty p{color:var(--soft);line-height:1.55;font-size:.9rem;margin-bottom:18px}
.mc__acts{display:flex;flex-direction:column;gap:10px}
/* ── Detalle del curso (Inicio) ── */
.mc__cols{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:start}
.mc__aside{display:grid;gap:14px;position:sticky;top:0}
.mc__banner{position:relative;border-radius:20px;overflow:hidden;background:var(--dark);aspect-ratio:21/9;box-shadow:0 18px 40px -22px rgba(12,36,16,.5)}
.mc__banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc__banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,36,16,0) 55%,rgba(12,36,16,.42))}
.mc__banner .mc__pills{position:absolute;left:14px;bottom:12px;z-index:1}
.mc__pills{display:flex;gap:7px;flex-wrap:wrap}
.mc__pills span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.26);background:rgba(10,20,12,.44);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:.68rem;font-weight:700;line-height:1;white-space:nowrap}
.mc__pills span svg{width:12px;height:12px}
.mc__pills span.gold{background:rgba(240,180,41,.3);border-color:rgba(240,180,41,.5);color:#ffe3a1}
.mc__head{margin-top:18px}
.mc__head h1{font-size:clamp(1.45rem,3.1vw,2.15rem);max-width:720px}
.mc__desc{margin-top:9px;color:var(--soft);font-size:.92rem;line-height:1.6;max-width:680px}
.mc__meta{display:flex;align-items:center;gap:7px 16px;flex-wrap:wrap;margin-top:13px;font-size:.8rem;font-weight:600;color:var(--soft)}
.mc__meta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mc__meta svg{width:14px;height:14px;color:var(--mute)}
.mc__rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;font-size:.82rem;color:var(--soft)}
.mc__rate b{font-family:'Archivo',sans-serif;font-size:.95rem;color:var(--ink)}
.mc__rate .sep{opacity:.4}
.mc__prog{display:flex;align-items:center;gap:12px;margin-top:16px}
.mc__prog .mc__bar{flex:1}
.mc__prog b{font-size:.8rem;font-weight:750;white-space:nowrap}
.mc__ctafila{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.mc__ctafila .mc__chip{height:30px}
.mc__stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:24px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.mc__stats>div{display:grid;gap:4px;justify-items:center;text-align:center;padding:15px 8px;border-left:1px solid var(--line)}
.mc__stats>div:first-child{border-left:0}
.mc__stats svg{width:17px;height:17px;color:var(--a)}
.mc__stats small{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mc__stats b{font-size:.86rem}
/* Panel «Tu aprendizaje» */
.mc__panel{padding:18px}
.mc__panel>.mc__eyebrow{margin-bottom:12px}
.mc__panel .mc__bar{margin-top:14px}
.mc__pstat{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.72rem;font-weight:650;color:var(--mute)}
.mc__bene{display:grid;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mc__bene span{display:flex;gap:9px;align-items:flex-start;font-size:.78rem;color:var(--soft);line-height:1.45}
.mc__bene svg{width:15px;height:15px;color:var(--ok);margin-top:1px}
.mc__wa{padding:16px;background:linear-gradient(140deg,rgba(46,125,50,.08),rgba(240,180,41,.07))}
.mc__wa b{display:block;font-size:.88rem;margin-bottom:3px}
.mc__wa p{font-size:.76rem;color:var(--soft);line-height:1.5;margin-bottom:11px}
/* ── Temario ── */
.mc__tem{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden;box-shadow:0 1px 2px rgba(12,36,16,.03)}
.mc__l{position:relative;width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:8px;padding:15px 16px;border-top:1px solid var(--line);transition:background .16s}
.mc__l:first-child{border-top:0}
.mc__l:not([disabled]):hover{background:#f8faf7}
.mc__l[disabled]{cursor:default}
.mc__ln{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--card);font-family:'Archivo',sans-serif;font-weight:750;font-size:.74rem;color:var(--soft)}
.mc__l.vista .mc__ln{background:var(--ok);border-color:var(--ok);color:#fff}
.mc__l.vista .mc__ln svg{width:15px;height:15px;stroke-width:2.6}
.mc__l.sig .mc__ln{border-color:var(--gold);color:#8a6200;box-shadow:0 0 0 4px rgba(240,180,41,.16)}
.mc__l[disabled] .mc__ln{background:#f0f2ee;border-color:var(--line);color:var(--mute)}
.mc__l.conimg{grid-template-columns:46px 92px minmax(0,1fr) auto}
.mc__lth{width:92px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#eef1ec;border:1px solid var(--line);display:block}
.mc__l[disabled] .mc__lth{filter:grayscale(.5);opacity:.75}
.mc__lt{display:grid;gap:3px;min-width:0}
.mc__lt em{font-style:normal;font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mc__l.vista .mc__lt em{color:var(--ok)}

    <button type="button" class="mc__ni ${activa === 'cuenta' ? 'on' : ''}" data-tab="cuenta">${I.user}Mi cuenta</button>

    <div class="mc__side-foot"><button type="button" class="mc__ni" id="mc-salir">${I.salir}Cerrar sesión</button></div>`;
  $('#mc-tabs').innerHTML = TABS.map(t => `<button type="button" class="mc__tab ${t.id === activa ? 'on' : ''}" data-tab="${t.id}" ${t.id === activa ? 'aria-current="page"' : ''}>${I[t.i]}${t.t}${t.id === 'certificado' && pendCert && activa !== 'certificado' ? '<span class="dot"></span>' : ''}</button>`).join('');
  const me = $('#mc-me');

  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => ir(b.dataset.tab));
  const s = $('#mc-salir'); if (s) s.onclick = async () => { await detener(); await signOut(auth); };
}

// ─── Render raíz ────────────────────────────────────────────────────────────
function cargando() { view.innerHTML = '<div class="mc__spin mc__spin--d"></div>'; }

async function render() {
  await detener();
  $('#mc-body').scrollTop = 0;
  $('#mc-me').hidden = true;
  if (!USER) { root.classList.add('solo'); $('#mc-titulo').textContent = 'Mi curso'; return vistaAcceso(); }
  if (!DATA) {
    root.classList.add('solo'); cargando();
    try { DATA = await api('/alumno/curso/' + encodeURIComponent(SLUG)); }
    catch (e) {
      if (e.status === 403) return vistaSinCompra();
      view.innerHTML = `<div class="mc__card mc__empty"><h2>No pudimos cargar tu curso</h2><p>${esc(e.message)}. Revisa tu conexión e intenta de nuevo.</p><div class="mc__acts"><button class="mc__btn mc__btn--p" id="mc-reint">Reintentar</button></div></div>`;
      $('#mc-reint').onclick = render; return;
    }
  }
  root.classList.remove('solo');
  $('#mc-titulo').textContent = DATA.curso.nombre;
  const r = rutaActual();
  pintarNav(r.tab);
  if (r.clase) return vistaClase(r.clase);
  if (r.tab === 'clases') return vistaClases();
  if (r.tab === 'materiales') return vistaMateriales();
  if (r.tab === 'cuenta') return vistaCuenta();
  if (r.tab === 'certificado') return vistaCertificado();
  vistaInicio();
}

// ─── Acceso / sin compra (pantalla sola) ────────────────────────────────────
function vistaAcceso(msg, ok) {
  const crear = MODO === 'crear';
  view.innerHTML = `<div class="mc__card mc__auth">
    <h2>${crear ? 'Crea tu contraseña' : 'Entra a tu curso'}</h2>
    <p class="mc__sub">Usa el <b>mismo correo con el que pagaste</b> ${esc(NOMBRES[SLUG] || 'tu curso')}. Si ya pagaste, verás tus clases grabadas y materiales.</p>
    <button type="button" class="mc__btn mc__btn--google" id="mc-google">${G} Continuar con Google</button>
    <div class="mc__sep">o con correo y contraseña</div>
    <form id="mc-form" novalidate>
      <label class="mc__field">Correo<input type="email" id="mc-email" autocomplete="email" inputmode="email" required></label>
      <label class="mc__field">Contraseña<input type="password" id="mc-pass" autocomplete="${crear ? 'new-password' : 'current-password'}" minlength="6" required></label>
      ${msg ? `<p class="mc__msg ${ok ? 'ok' : ''}" role="alert">${esc(msg)}</p>` : ''}
      <button class="mc__btn mc__btn--p" style="width:100%" type="submit" id="mc-enviar">${crear ? 'Crear cuenta' : 'Entrar'}</button>
    </form>
    <div class="mc__links"><button type="button" class="mc__link" id="mc-modo">${crear ? 'Ya tengo cuenta · Entrar' : '¿Primera vez? Crear mi contraseña'}</button><button type="button" class="mc__link" id="mc-reset">Olvidé mi contraseña</button></div>
    <p class="mc__help">¿Todavía no compras el curso? <button type="button" class="mc__link" id="mc-comprar">Inscríbete aquí</button></p>
  </div>`;
  $('#mc-google').onclick = async () => {
    try { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await signInWithPopup(auth, p); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return signInWithRedirect(auth, new GoogleAuthProvider());
      if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') vistaAcceso('No pudimos iniciar sesión con Google. Intenta de nuevo.');
    }
  };
  $('#mc-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $('#mc-email').value.trim(), pass = $('#mc-pass').value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return vistaAcceso('Escribe un correo válido.');
    if (pass.length < 6) return vistaAcceso('La contraseña debe tener al menos 6 caracteres.');
    $('#mc-enviar').disabled = true;
    try {
      if (crear) { const c = await createUserWithEmailAndPassword(auth, email, pass); await sendEmailVerification(c.user).catch(() => {}); }
      else await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      const c = e && e.code || '';
      vistaAcceso(c === 'auth/too-many-requests' ? 'Demasiados intentos. Espera unos minutos.' : c === 'auth/email-already-in-use' ? 'No pudimos crear la cuenta. Si ya tienes una, entra o restablece tu contraseña.' : 'No pudimos iniciar sesión. Revisa tus datos o restablece tu contraseña.');
    }
  };
  $('#mc-modo').onclick = () => { MODO = crear ? 'entrar' : 'crear'; vistaAcceso(); };
  $('#mc-reset').onclick = async () => {
    const email = $('#mc-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return vistaAcceso('Escribe tu correo y vuelve a tocar «Olvidé mi contraseña».');
    try { await sendPasswordResetEmail(auth, email); } catch (_) {}
    vistaAcceso('Si ese correo tiene una cuenta, te enviamos un enlace para crear una nueva contraseña.', true);
  };
  $('#mc-comprar').onclick = irAlPago;
}

  $('#mc-titulo').textContent = 'Mi curso';

const fecha = (iso) => { try { const d = new Date(iso && iso.seconds ? iso.seconds * 1000 : iso); return isNaN(d) ? '' : d.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (_) { return ''; } };
const fb = `onerror="this.onerror=null;this.src='${esc(PORTADA)}'"`;

}
function filaClase(cl, i, d, sig) {
  const pc = d.progreso.clases?.[cl.id] || {}; const pub = cl.estado === 'publicada';

  const sub = pc.completada ? 'Completada · vuelve a verla cuando quieras' : !pub ? 'Se publica muy pronto' : (cl.duracionMin ? cl.duracionMin + ' min · ' : '') + 'Disponible ahora';
  const accion = !pub ? `<span class="mc__chip">${I.lock}<span>Pendiente</span></span>`
    : pc.completada ? `<span class="mc__chip mc__chip--line">${I.check}<span>Repasar</span></span>`

function ligarCalifica() {
  const stars = $('#mc-stars'); if (!stars) return;
  const ETQ = ['', 'Puede mejorar', 'Regular', 'Buen curso', 'Muy buen curso', 'Excelente curso'];
  const c = DATA.calificaciones || {};
  if (!CAL.sel && c.mia) CAL.sel = c.mia.estrellas;
  stars.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
    CAL.sel = Number(b.dataset.star);
    stars.querySelectorAll('[data-star]').forEach(x => x.classList.toggle('on', Number(x.dataset.star) <= CAL.sel));
    $('#mc-callbl').textContent = '● ' + ETQ[CAL.sel];
  });
  const ta = $('#mc-calcom');
  ta.oninput = () => { $('#mc-calcnt').textContent = ta.value.length + ' / 1000'; };
  $('#mc-calguardar').onclick = async () => {
    if (!CAL.sel) { toast('Elige de 1 a 5 estrellas', true); return; }
    const b = $('#mc-calguardar'); b.disabled = true;
    try {
      const r = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/calificacion', { method: 'POST', body: { estrellas: CAL.sel, comentario: ta.value } });
      DATA.calificaciones = r.calificaciones;

      render();
    } catch (e) { b.disabled = false; toast(e.message || 'No pudimos guardar tu valoración', true); }
  };

function ligarVista() {
  view.querySelectorAll('[data-clase]').forEach(b => b.onclick = () => irClase(b.dataset.clase));
  view.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
  view.querySelectorAll('[data-mat]').forEach(b => b.onclick = async () => {

}

const ESTADOS_MX = ['Aguascalientes','Baja California','Baja California Sur','Campeche','Chiapas','Chihuahua','Ciudad de México','Coahuila','Colima','Durango','Estado de México','Guanajuato','Guerrero','Hidalgo','Jalisco','Michoacán','Morelos','Nayarit','Nuevo León','Oaxaca','Puebla','Querétaro','Quintana Roo','San Luis Potosí','Sinaloa','Sonora','Tabasco','Tamaulipas','Tlaxcala','Veracruz','Yucatán','Zacatecas','Fuera de México'];
let CERT_EDITAR = false;
function vistaCertificado(msg) {
  const d = DATA, ce = d.certificado || {}, so = d.solicitudCertificado, p = d.progreso;
  const urlCert = (() => { const u = String(ce.url || '').trim(); if (!/^https?:\/\//i.test(u)) return '';
    try { const x = new URL(u); return (!x.pathname || x.pathname === '/' || /^\/index\.html?$/i.test(x.pathname)) ? '' : u; } catch (_) { return ''; } })();
  const emitido = (ce.estado === 'emitido' && (urlCert || so)) || so?.estado === 'emitido';
  const pasos = `<div class="mc__card mc__pasos"><span class="mc__eyebrow mute">Cómo funciona</span>
    <div class="mc__paso ${so || emitido ? 'ok' : ''}"><b>${so || emitido ? '✓' : '1'}</b><span>Envías tus datos tal como deben aparecer en el certificado.</span></div>
    <div class="mc__paso ${so?.estado === 'en_proceso' || emitido ? 'ok' : ''}"><b>${so?.estado === 'en_proceso' || emitido ? '✓' : '2'}</b><span>Nuestro equipo revisa tu solicitud y emite el certificado con QR y folio.</span></div>
    <div class="mc__paso ${emitido ? 'ok' : ''}"><b>${emitido ? '✓' : '3'}</b><span>Te llega a tu correo y lo verás aquí.</span></div>
    <div class="mc__rowstat"><span>Avance del curso</span><b>${p.porcentaje}%</b></div></div>`;
  let cuerpo;
  if (emitido) {
    cuerpo = `<div class="mc__cfh"><i>${I.cert}</i><div><h2>Tu certificado está listo</h2><p>${ce.folio ? `Folio <b>${esc(ce.folio)}</b> · ` : ''}con QR verificable.</p></div></div>
      ${urlCert ? `<a class="mc__btn mc__btn--g" style="width:100%" href="${esc(urlCert)}" target="_blank" rel="noopener">${I.cert} Ver mi certificado</a>` : `<div class="mc__card mc__estado"><p style="color:var(--soft)">Te enviamos tu certificado por correo. Si no lo encuentras, escríbenos por WhatsApp.</p></div>`}`;
  } else if (so && !CERT_EDITAR) {
    const txt = ({ pendiente: 'Recibimos tu solicitud', en_proceso: 'Tu certificado está en proceso', rechazado: 'Necesitamos revisar tus datos' })[so.estado] || 'Recibimos tu solicitud';
    cuerpo = `<div class="mc__cfh"><i>${I.cert}</i><div><h2>${txt}</h2><p>${fecha(so.fechaSolicitud) ? 'Enviada el ' + esc(fecha(so.fechaSolicitud)) + '. ' : ''}Te avisaremos por correo y WhatsApp cuando esté emitido.</p></div></div>
      <div class="mc__card mc__estado"><dl>
        <dt>Nombre en el certificado</dt><dd><b>${esc(so.nombreCompleto)}</b></dd>
        <dt>WhatsApp</dt><dd>${esc(so.whatsapp || '—')}</dd>
        <dt>Ubicación</dt><dd>${esc([so.ciudad, so.estadoRep].filter(Boolean).join(', ') || '—')}</dd>
        <dt>Correo</dt><dd>${esc(USER.email || '—')}</dd>
      </dl>
      ${so.estado !== 'en_proceso' ? '<button type="button" class="mc__btn mc__btn--l mc__btn--sm" id="mc-cert-editar">Corregir mis datos</button>' : ''}</div>`;
  } else {
    const v = so || {};
    cuerpo = `<div class="mc__cfh"><i>${I.cert}</i><div><h2>Solicitar mi certificado</h2><p>Escribe tu nombre exactamente como quieres que aparezca. Se emite con QR verificable y folio único.</p></div></div>
      <form class="mc__card mc__form" id="mc-cert-form" novalidate>
        <label class="mc__field">Nombre completo para el certificado<input id="cf-nombre" autocomplete="name" maxlength="120" value="${esc(v.nombreCompleto || USER.displayName || '')}" placeholder="Ej. María González Ramírez" required><small>Revisa acentos y mayúsculas: así se imprimirá.</small></label>
        <div class="mc__grid2">
          <label class="mc__field">WhatsApp<input id="cf-wa" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" value="${esc(v.whatsapp || '')}" placeholder="10 dígitos" required></label>
          <label class="mc__field">Correo<input value="${esc(USER.email || '')}" disabled></label>
          <label class="mc__field">Estado<select id="cf-estado" required><option value="">Selecciona…</option>${ESTADOS_MX.map(e => `<option ${v.estadoRep === e ? 'selected' : ''}>${e}</option>`).join('')}</select></label>
          <label class="mc__field">Ciudad o municipio <span class="mc__opt">(opcional)</span><input id="cf-ciudad" maxlength="80" value="${esc(v.ciudad || '')}" autocomplete="address-level2"></label>
        </div>
        <label class="mc__field">Ocupación <span class="mc__opt">(opcional)</span><input id="cf-ocup" maxlength="80" placeholder="Ej. Productor, estudiante, MVZ"></label>
        <label class="mc__field">Comentarios <span class="mc__opt">(opcional)</span><textarea id="cf-com" maxlength="400" placeholder="Algo que debamos saber para tu certificado"></textarea></label>
        ${msg ? `<p class="mc__msg" role="alert">${esc(msg)}</p>` : ''}
        <button class="mc__btn mc__btn--g" style="width:100%" type="submit" id="cf-enviar">${I.cert} Solicitar mi certificado</button>
        ${CERT_EDITAR ? '<button type="button" class="mc__btn mc__btn--l" style="width:100%;margin-top:8px" id="cf-cancelar">Cancelar</button>' : ''}
      </form>`;
  }
  view.innerHTML = `<span class="mc__eyebrow">${esc(d.curso.nombre)}</span>
    <div class="mc__sh" style="margin-top:4px"><h2>Mi certificado</h2><b>${estadoCertTexto()}</b></div>
    <div class="mc__cf"><div>${cuerpo}</div><aside class="mc__aside">${pasos}</aside></div>`;
  ligarVista();
  const ed = $('#mc-cert-editar'); if (ed) ed.onclick = () => { CERT_EDITAR = true; vistaCertificado(); };
  const ca = $('#cf-cancelar'); if (ca) ca.onclick = () => { CERT_EDITAR = false; vistaCertificado(); };
  const f = $('#mc-cert-form');
  if (f) f.onsubmit = async (ev) => {
    ev.preventDefault();
    const nombre = $('#cf-nombre').value.trim(), wa = $('#cf-wa').value.trim(), est = $('#cf-estado').value;
    if (nombre.split(/\s+/).filter(Boolean).length < 2) return certErr('Escribe tu nombre completo (nombre y apellidos).');
    if (wa.replace(/\D/g, '').length < 10) return certErr('Escribe un WhatsApp de 10 dígitos.');
    if (!est) return certErr('Selecciona tu estado.');
    const b = $('#cf-enviar'); b.disabled = true; b.textContent = 'Enviando…';
    try {
      const r = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/certificado/solicitar', { method: 'POST', body: {
        nombreCompleto: nombre, whatsapp: wa, estado: est, ciudad: $('#cf-ciudad').value, ocupacion: $('#cf-ocup').value, comentarios: $('#cf-com').value } });
      DATA.solicitudCertificado = r.solicitud; CERT_EDITAR = false;
      toast('¡Listo! Recibimos tu solicitud de certificado');
      pintarNav('certificado'); vistaCertificado();
    } catch (e) { b.disabled = false; b.innerHTML = I.cert + ' Solicitar mi certificado'; certErr(e.message || 'No pudimos enviar tu solicitud'); }
  };
  function certErr(m) {
    const vals = { n: $('#cf-nombre')?.value, w: $('#cf-wa')?.value, e: $('#cf-estado')?.value, c: $('#cf-ciudad')?.value, o: $('#cf-ocup')?.value, t: $('#cf-com')?.value };
    vistaCertificado(m);
    if (vals.n != null && $('#cf-nombre')) { $('#cf-nombre').value = vals.n; $('#cf-wa').value = vals.w; $('#cf-estado').value = vals.e; $('#cf-ciudad').value = vals.c; $('#cf-ocup').value = vals.o; $('#cf-com').value = vals.t; }
  }
}

// ─── Clase (reproductor) ────────────────────────────────────────────────────
async function vistaClase(id) {
  const d = DATA, idx = d.clases.findIndex(c => c.id === id), cl = d.clases[idx];
  if (!cl || cl.estado !== 'publicada') { history.replaceState({ mc: 1 }, '', '#mi-curso/clases'); return vistaClases(); }
  const pubs = d.clases.filter(c => c.estado === 'publicada'), k = pubs.findIndex(c => c.id === id);
  const prev = pubs[k - 1], next = pubs[k + 1], pc = (d.progreso.clases || {})[id] || {};
  const mats = d.materiales.filter(m => m.disponible && (m.claseId === id || (cl.materialesIds || []).includes(m.id)));
  view.innerHTML = `<button type="button" class="mc__back" data-ir="clases"><span>${I.atras}</span> ${esc(d.curso.nombre)}</button>
  <div class="mc__pl"><div>
    <div class="mc__player" id="mc-player"><div class="mc__pst"><div class="mc__spin"></div><span>Preparando la clase…</span></div></div>
    <div class="mc__lh"><span class="mc__eyebrow">Clase ${idx + 1} de ${d.clases.length}</span>
      <h1>${esc(cl.titulo)}</h1>
      <div class="mc__lmeta">
        <span class="mc__chip">${d.progreso.completadas} de ${d.progreso.total} vistas · ${d.progreso.porcentaje}%</span>
        <span class="mc__chip ${pc.completada ? 'mc__chip--ok' : ''}" id="mc-chip">${pc.completada ? I.check + ' Ya vista · continúa' : (cl.duracionMin ? I.reloj + ' ' + cl.duracionMin + ' min' : 'En curso')}</span>
      </div></div>
    <div class="mc__nav">
      ${prev ? `<button class="mc__btn mc__btn--l" data-clase="${esc(prev.id)}">${I.atras} Anterior</button>` : ''}
      <button class="mc__btn ${pc.completada ? 'mc__btn--l' : 'mc__btn--g'}" id="mc-vista" ${pc.completada ? 'disabled' : ''}>${I.check} ${pc.completada ? 'Clase vista' : 'Marcar como vista'}</button>
      ${next ? `<button class="mc__btn mc__btn--p" data-clase="${esc(next.id)}">Siguiente ${I.flecha}</button>` : ''}
    </div>
    ${cl.descripcion ? `<div class="mc__sec mc__card mc__resumen"><span class="mc__eyebrow">Resumen de la clase</span><h3>Lo que vas a aprender</h3><p>${esc(cl.descripcion)}</p>
      <div class="mc__verif">${I.escudo} Contenido verificado por el equipo de Visión Pecuaria</div></div>` : ''}
    ${next ? `<div class="mc__sec"><span class="mc__eyebrow mute">A continuación · Clase ${d.clases.indexOf(next) + 1}</span>
      <button type="button" class="mc__card mc__next" style="margin-top:8px" data-clase="${esc(next.id)}">
        <img src="${portadaDe(d.clases.indexOf(next)) || esc(next.miniatura || d.curso.portada || PORTADA)}" alt="" ${fb}>
        <span style="min-width:0;text-align:left;flex:1"><b>${esc(next.titulo)}</b><small>${next.duracionMin ? next.duracionMin + ' min · ' : ''}Lista para continuar</small></span>
        <span class="mc__go">${I.flecha}</span></button></div>` : ''}
    ${mats.length ? `<div class="mc__sec"><span class="mc__eyebrow">Tu espacio de estudio</span>
      <div class="mc__sh" style="margin-top:4px"><h2>Recursos de la clase</h2><b>${mats.length}</b></div>
      <div class="mc__ms">${mats.map(mat).join('')}</div></div>` : ''}
    <div class="mc__sec">${bloqueCalifica()}</div>
  </div>
  <aside class="mc__card mc__list" aria-label="Clases del curso"><h3>${esc(d.curso.nombre)}</h3><p>${d.progreso.completadas} de ${d.progreso.total} clases vistas</p>
    ${d.clases.map((x, i) => { const v = ((d.progreso.clases || {})[x.id] || {}).completada, pb = x.estado === 'publicada';
      return `<button class="mc__li ${x.id === id ? 'on' : ''} ${v ? 'vista' : ''}" ${pb ? `data-clase="${esc(x.id)}"` : 'disabled'}><span>${v ? I.check : i + 1}</span><span>${esc(x.titulo)}<small>${pb ? (x.duracionMin ? x.duracionMin + ' min' : 'Grabación') : 'Grabación pendiente de publicación'}</small></span></button>`; }).join('')}
  </aside></div>`;
  ligarVista();
  $('#mc-vista').onclick = () => guardar(true, true);
  SEG = { id, base: Number(pc.segundos) || 0, ses: 0, env: 0, comp: !!pc.completada, pos: Number(pc.posicion) || 0, dur: cl.duracionMin, video: null, t: null };
  try {
    const src = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/video', { method: 'POST', body: { claseId: id } });
    const pl = $('#mc-player'); if (!pl || !SEG || SEG.id !== id) return;
    if (src.tipo === 'video') {
      const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.setAttribute('controlsList', 'nodownload'); v.src = src.url;
      v.addEventListener('loadedmetadata', () => { if (SEG && SEG.pos > 5 && SEG.pos < v.duration - 10) v.currentTime = SEG.pos; });
      v.addEventListener('ended', () => guardar(true));
      pl.innerHTML = ''; pl.appendChild(v); SEG.video = v;
    } else pl.innerHTML = `<iframe src="${esc(src.url)}" title="${esc(cl.titulo)}" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    SEG.t = setInterval(() => {
      if (!SEG || document.hidden || (SEG.video && SEG.video.paused)) return;
      SEG.ses++; if (SEG.video) SEG.pos = Math.floor(SEG.video.currentTime || 0);
      if (!SEG.comp && !SEG.video && SEG.dur && SEG.base + SEG.ses >= SEG.dur * 48) guardar(true);
      if (SEG.ses - SEG.env >= 20) guardar(false);
    }, 1000);
  } catch (e) {
    const pl = $('#mc-player'); if (pl) pl.innerHTML = `<div class="mc__pst">${I.lock}<b>${esc(e.message || 'No pudimos abrir el video')}</b></div>`;
  }
}

async function guardar(comp, avisar) {
  if (!SEG) return; const s = SEG; s.env = s.ses; if (comp) s.comp = true;
  try {
    const r = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/progreso', { method: 'POST', keepalive: true, body: { claseId: s.id, segundos: s.base + s.ses, completada: s.comp, posicion: s.pos, clientTs: Date.now() } });
    if (DATA && r.progreso) DATA.progreso = r.progreso;
    if (comp && SEG === s) { const b = $('#mc-vista'); if (b) { b.disabled = true; b.className = 'mc__btn mc__btn--l'; b.innerHTML = I.check + ' Clase vista'; }
      const ch = $('#mc-chip'); if (ch) { ch.className = 'mc__chip mc__chip--ok'; ch.innerHTML = I.check + ' Ya vista · continúa'; } if (avisar) toast('Clase marcada como vista'); }
  } catch (_) { if (avisar) toast('No pudimos guardar tu progreso', true); }
}
async function detener() {
  if (!SEG) return; clearInterval(SEG.t); const s = SEG;
  if (s.ses > s.env) await guardar(false);
  if (s.video) try { s.video.pause(); } catch (_) {}
  SEG = null;
}
document.addEventListener('visibilitychange', () => { if (document.hidden && SEG && SEG.ses > SEG.env) guardar(false); });
window.addEventListener('pagehide', () => { if (SEG && SEG.ses > SEG.env) guardar(false); });
</script>

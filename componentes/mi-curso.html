<!-- MI-CURSO:INICIO · componente autocontenido (fuente: componentes/mi-curso.html · se inyecta con componentes/inyectar.py) -->
<style id="mi-curso-css">
.mc{--mc-accent:#2e7d32;--mc-accent-2:#12421a;--mc-dark:#07230c;--mc-gold:#ffc93c;--mc-gold-2:#e0a91f;--mc-bg:#f3f6f1;--mc-card:#fff;--mc-ink:#102015;--mc-soft:#4f6656;--mc-mute:#7c8f81;--mc-line:rgba(16,32,21,.09);
  position:fixed;inset:0;z-index:2147483000;background:var(--mc-bg);color:var(--mc-ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.mc[hidden]{display:none!important}.mc *{box-sizing:border-box}.mc [hidden]{display:none!important}
:where(.mc) button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:where(.mc) svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:where(.mc) :is(h1,h2,h3){margin:0;font-family:'Archivo','Inter',system-ui,sans-serif;letter-spacing:-.015em;line-height:1.2}
:where(.mc) p{margin:0}
/* ── Topbar ── */
.mc__top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--mc-card);border-bottom:1px solid var(--mc-line)}
.mc__brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mc__brand>div{min-width:0}
.mc__brand img{width:34px;height:34px;border-radius:9px;flex:none}
.mc__brand b{display:block;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc__brand small{display:block;font-size:.68rem;color:var(--mc-accent);text-transform:uppercase;letter-spacing:.09em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc__x{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--mc-bg);border:1px solid var(--mc-line);font-weight:600;font-size:.84rem}
.mc__x:hover{border-color:var(--mc-accent);color:var(--mc-accent)}
.mc__x svg{width:16px;height:16px}
/* ── Layout con sidebar ── */
.mc__shell{flex:1;display:flex;min-height:0}
.mc__side{flex:none;width:224px;background:var(--mc-card);border-right:1px solid var(--mc-line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.mc__glabel{font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mc-mute);padding:14px 10px 6px}
.mc__glabel:first-child{padding-top:2px}
.mc__ni{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:9px 11px;border-radius:11px;font-size:.84rem;font-weight:500;color:var(--mc-soft);text-align:left;text-decoration:none;transition:background .15s,color .15s}
.mc__ni svg{width:16px;height:16px}
.mc__ni:hover{background:var(--mc-bg);color:var(--mc-ink)}
.mc__ni.on{background:linear-gradient(90deg,rgba(46,125,50,.16),rgba(46,125,50,.05));color:var(--mc-accent);font-weight:700;box-shadow:inset 0 0 0 1px rgba(46,125,50,.14)}
.mc__ni.on::before{content:'';position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 4px 4px 0;background:var(--mc-accent)}
.mc__side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--mc-line)}
.mc__main{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mc__wrap{max-width:1080px;margin:0 auto;padding:26px 24px calc(44px + env(safe-area-inset-bottom))}
/* ── Nav inferior (teléfono) ── */
.mc__tabs{flex:none;display:none;background:var(--mc-card);border-top:1px solid var(--mc-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
.mc__tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mc-mute);padding:5px 10px;border-radius:9px;font-size:.62rem;font-weight:600;letter-spacing:.02em}
.mc__tab svg{width:19px;height:19px}
.mc__tab.on{color:var(--mc-accent)}
/* ── Comunes ── */
.mc__btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .15s}
.mc__btn:active{transform:scale(.98)}
.mc__btn--p{background:linear-gradient(180deg,var(--mc-accent),var(--mc-accent-2));color:#fff!important}
.mc__btn--g{background:linear-gradient(180deg,var(--mc-gold),var(--mc-gold-2));color:var(--mc-dark)!important}
.mc__btn--l{background:var(--mc-card);color:var(--mc-ink)!important;border:1px solid var(--mc-line)}
.mc__btn--google{width:100%;background:#fff;color:#1f2937!important;border:1px solid #dadce0}
.mc__btn[disabled]{opacity:.55;cursor:not-allowed}
.mc__btn--sm{min-height:38px;padding:0 14px;font-size:.84rem;border-radius:10px}
.mc__link{color:var(--mc-accent);font-weight:600;font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
.mc__card{background:var(--mc-card);border:1px solid var(--mc-line);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(7,35,12,.06)}
.mc__chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;font-size:.73rem;font-weight:700;background:#e6eee5;color:var(--mc-soft);white-space:nowrap}
.mc__chip svg{width:14px;height:14px}
.mc__chip--ok{background:#e3f3e4;color:#1b5e20}.mc__chip--pend{background:#fff4d6;color:#7a5600}.mc__chip--gold{background:rgba(255,201,60,.22);color:#6b4e00}
.mc__h{font-size:clamp(1.3rem,2.3vw,1.7rem)}
.mc__eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mc-accent)}
.mc__sec{margin-top:26px}
.mc__sech{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mc__sech h2{font-size:1.1rem}
.mc__spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--mc-gold);animation:mcspin .8s linear infinite}
.mc__spin--d{border-color:var(--mc-line);border-top-color:var(--mc-accent);margin:60px auto}
@keyframes mcspin{to{transform:rotate(360deg)}}
.mc__ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mc-accent) calc(var(--p)*1%),#e6eee5 0);flex:none}
.mc__ring>div{width:76px;height:76px;border-radius:50%;background:var(--mc-card);display:grid;place-items:center;text-align:center;font-weight:800;font-size:1.2rem;line-height:1}
.mc__ring small{display:block;font-size:.6rem;font-weight:600;color:var(--mc-mute);margin-top:3px}
/* ── Acceso / vacíos ── */
.mc__auth{max-width:420px;margin:26px auto;padding:28px 24px}
.mc__auth h2{font-size:1.45rem;margin-bottom:6px}
.mc__auth .mc__sub{color:var(--mc-soft);font-size:.92rem;line-height:1.5;margin-bottom:18px}
.mc__sep{display:flex;align-items:center;gap:12px;color:var(--mc-mute);font-size:.78rem;margin:16px 0}
.mc__sep:before,.mc__sep:after{content:'';flex:1;height:1px;background:var(--mc-line)}
.mc__field{display:grid;gap:6px;margin-bottom:12px;font-size:.82rem;font-weight:600;color:var(--mc-soft)}
.mc__field input{width:100%;min-width:0;height:46px;border-radius:12px;border:1px solid var(--mc-line);background:var(--mc-bg);padding:0 14px;font:inherit;font-size:1rem;color:var(--mc-ink)}
.mc__field input:focus{outline:none;border-color:var(--mc-accent);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
.mc__msg{font-size:.85rem;border-radius:10px;padding:10px 12px;margin-bottom:12px;background:#fdecea;color:#8a1c13;line-height:1.45}
.mc__msg.ok{background:#e8f5e9;color:#12421a}
.mc__links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.mc__help{margin-top:16px;font-size:.8rem;color:var(--mc-mute);line-height:1.5}
.mc__empty{max-width:520px;margin:30px auto;padding:30px 24px;text-align:center}
.mc__empty h2{font-size:1.3rem;margin:10px 0 8px}
.mc__empty p{color:var(--mc-soft);line-height:1.55;font-size:.93rem;margin-bottom:18px}
.mc__acts{display:flex;flex-direction:column;gap:10px}
/* ── Inicio ── */
.mc__cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.mc__aside{display:grid;gap:16px;position:sticky;top:0}
.mc__hero{position:relative;border-radius:22px;overflow:hidden;background:var(--mc-dark);color:#fff;display:flex;align-items:flex-end;min-height:230px}
.mc__hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.mc__hero:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,35,12,.1),rgba(7,35,12,.93));z-index:1}
.mc__hero>div{position:relative;z-index:2;padding:26px;width:100%}
.mc__hero h1{font-size:clamp(1.3rem,2.4vw,1.9rem);max-width:640px;color:#fff;margin-top:10px}
.mc__hero p{color:#c7dcc9;margin-top:6px;font-size:.9rem}
.mc__tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px;font-size:.73rem;font-weight:700;background:rgba(255,201,60,.22);color:#ffd971}
.mc__tag svg{width:14px;height:14px}
.mc__next{display:flex;gap:16px;align-items:center;padding:14px;overflow:hidden}
.mc__next img{width:148px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;flex:none;background:var(--mc-dark)}
.mc__next b{display:block;font-size:.95rem;margin:2px 0 4px}
.mc__next small{color:var(--mc-mute);font-size:.76rem}
.mc__panel{padding:18px}
.mc__panel>h3{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mc-mute);margin-bottom:14px}
.mc__rowstat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--mc-line);font-size:.85rem;color:var(--mc-soft)}
.mc__rowstat b{color:var(--mc-ink)}
.mc__panel .mc__ring{margin:0 auto 14px}
.mc__wa{padding:18px;background:linear-gradient(140deg,rgba(46,125,50,.1),rgba(255,201,60,.08))}
.mc__wa b{display:block;font-size:.92rem;margin-bottom:4px}
.mc__wa p{font-size:.8rem;color:var(--mc-soft);line-height:1.5;margin-bottom:12px}
/* ── Temario ── */
.mc__tem{display:grid;gap:10px}
.mc__row{position:relative;display:grid;grid-template-columns:auto 118px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;text-align:left;width:100%;transition:transform .2s}
.mc__row:not([disabled]):hover{transform:translateY(-2px)}
.mc__row[disabled]{cursor:default;opacity:.75}
.mc__num{font-family:'Archivo',sans-serif;font-weight:800;font-size:.95rem;color:var(--mc-mute);width:28px;text-align:center}
.mc__row.vista .mc__num{color:var(--mc-accent)}
.mc__row.sig{box-shadow:inset 0 0 0 2px rgba(255,201,60,.6)}
.mc__thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--mc-dark)}
.mc__thumb img{width:100%;height:100%;object-fit:cover}
.mc__thumb span{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,35,12,.35);color:#fff}
.mc__thumb span svg{width:20px;height:20px}
.mc__row h3{font-size:.95rem;line-height:1.3}
.mc__rmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mc__go{display:inline-flex;align-items:center;gap:6px;color:var(--mc-accent);font-weight:700;font-size:.82rem;white-space:nowrap}
.mc__go svg{width:15px;height:15px}
/* ── Materiales ── */
.mc__mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.mc__mat{display:flex;gap:14px;align-items:center;padding:16px;text-align:left;width:100%;transition:transform .2s}
.mc__mat:hover{transform:translateY(-2px)}
.mc__mat i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:#fdecea;color:#b3261e;font-style:normal}
.mc__mat i.x{background:#e3f3e4;color:#1b5e20}
.mc__mat b{display:block;font-size:.92rem}.mc__mat small{color:var(--mc-mute);font-size:.78rem}
/* ── Cuenta ── */
.mc__cuenta{padding:20px;display:grid;gap:10px}
.mc__cuenta dl{display:grid;grid-template-columns:130px 1fr;gap:9px 16px;font-size:.88rem;margin:0}
.mc__cuenta dt{color:var(--mc-mute)}.mc__cuenta dd{margin:0;word-break:break-all}
.mc__cert{padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mc__cert p{color:var(--mc-soft);font-size:.86rem;line-height:1.5;margin-top:4px;max-width:620px}
/* ── Clase ── */
.mc__pl{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.mc__player{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden}
.mc__player iframe,.mc__player video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mc__pst{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;color:#d9e6da;text-align:center;padding:20px;font-size:.9rem}
.mc__lh{margin-top:16px;display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.mc__lh small{color:var(--mc-accent);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.mc__lh h1{font-size:clamp(1.1rem,2vw,1.45rem);margin-top:4px}
.mc__nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.mc__nav .mc__btn{flex:1 1 150px}
.mc__list{padding:8px;max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:0}
.mc__list h3{font-size:.95rem;padding:10px 10px 2px}.mc__list>p{font-size:.78rem;color:var(--mc-mute);padding:0 10px 10px}
.mc__li{width:100%;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;padding:10px;border-radius:10px;text-align:left;font-size:.86rem}
.mc__li:hover:not([disabled]){background:var(--mc-bg)}.mc__li.on{background:rgba(46,125,50,.12)}.mc__li[disabled]{opacity:.55;cursor:default}
.mc__li span:first-child{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#e6eee5;font-weight:700;font-size:.78rem}
.mc__li.vista span:first-child{background:var(--mc-accent);color:#fff}
.mc__li small{display:block;color:var(--mc-mute);font-size:.74rem;margin-top:2px}
.mc__toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--mc-dark);color:#fff;padding:12px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:.3s;z-index:2147483001;max-width:calc(100vw - 32px)}
.mc__toast.on{opacity:1;transform:translate(-50%,0)}.mc__toast.err{background:#8a1c13}
/* ── Modo sin sesión / sin compra: pantalla sola ── */
.mc.solo .mc__side,.mc.solo .mc__tabs{display:none!important}
/* ── Responsive ── */
@media (max-width:1060px){.mc__cols{grid-template-columns:1fr}.mc__aside{position:static;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:980px){.mc__pl{grid-template-columns:1fr}.mc__list{position:static;max-height:none}}
@media (max-width:900px){
  .mc__side{display:none}
  .mc:not(.solo) .mc__tabs{display:flex}
  .mc__top .mc__x span{display:none}
  .mc__top .mc__x{width:38px;padding:0;justify-content:center}
}
@media (max-width:620px){
  .mc__wrap{padding:16px 14px calc(30px + env(safe-area-inset-bottom))}
  .mc__top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  .mc__hero>div{padding:18px}.mc__hero{min-height:190px}
  .mc__row{grid-template-columns:auto 92px minmax(0,1fr)}
  .mc__row .mc__go{position:absolute;right:12px;bottom:12px}
  .mc__row .mc__go span{display:none}
  .mc__row h3{font-size:.88rem}
  .mc__mats{grid-template-columns:1fr}
  .mc__cuenta dl{grid-template-columns:1fr;gap:2px}.mc__cuenta dd{margin-bottom:8px}
  .mc__auth{padding:22px 16px;margin:8px auto}
  .mc__player{border-radius:10px}
  .mc__next img{width:112px}
}
@media (prefers-reduced-motion:reduce){.mc *{animation:none!important;transition:none!important}}

/* ════════ v3 · estilo ICADEM: portada, filas de clase, cápsula inferior, certificado ════════ */
.mc__top{gap:10px}
.mc__me{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--mc-accent),var(--mc-accent-2));color:#fff;font-weight:800;font-size:.85rem;letter-spacing:.02em;box-shadow:0 4px 12px rgba(18,66,26,.25)}
.mc.solo .mc__me{display:none}
.mc__me.on{box-shadow:0 0 0 3px rgba(255,201,60,.65)}
/* Portada del curso */
.mc__cover{position:relative;overflow:hidden;border-radius:22px;min-height:300px;display:flex;align-items:flex-end;justify-content:space-between;gap:22px;padding:30px;color:#fff;background:var(--mc-dark);box-shadow:0 20px 48px -24px rgba(7,35,12,.55)}
.mc__cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mc__cover:before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(7,35,12,.05) 0%,rgba(7,35,12,.55) 45%,rgba(7,35,12,.94) 100%)}
.mc__cover>div{position:relative;z-index:2;min-width:0}
.mc__pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.mc__pills span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.13);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:.74rem;font-weight:650;line-height:1;white-space:nowrap}
.mc__pills span svg{width:13px;height:13px}
.mc__pills span.gold{background:rgba(255,201,60,.26);border-color:rgba(255,201,60,.45);color:#ffe08a}
.mc__cover h1{color:#fff;font-size:clamp(1.55rem,3.6vw,2.6rem);line-height:1.06;letter-spacing:-.03em;max-width:680px}
.mc__cover p{margin-top:12px;color:rgba(255,255,255,.78);font-size:.9rem;display:grid;gap:2px}
.mc__cover p b{color:#fff;font-size:.95rem}
.mc__start{display:inline-flex;align-items:center;gap:11px;min-height:52px;padding:0 20px 0 24px;border-radius:999px;background:#fff;color:var(--mc-dark)!important;font-weight:750;font-size:.92rem;white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.55);flex:none;text-decoration:none}
.mc__start svg{width:22px;height:22px;padding:5px;border-radius:50%;background:var(--mc-accent);color:#fff;stroke-width:2.4}
.mc__start:hover{transform:translateY(-1px)}
/* Encabezados de sección */
.mc__sh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 0 14px}
.mc__sh span{display:block;color:var(--mc-accent);font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.mc__sh h2{font-size:clamp(1.15rem,2.2vw,1.45rem);letter-spacing:-.02em}
.mc__sh>b{padding:6px 11px;border-radius:999px;background:rgba(46,125,50,.1);color:var(--mc-accent);font-size:.74rem;font-weight:750;white-space:nowrap}
/* Filas de clase */
.mc__ls{display:grid;gap:10px}
.mc__l{position:relative;width:100%;display:grid;grid-template-columns:150px minmax(0,1fr) 40px;align-items:center;gap:16px;padding:9px 14px 9px 9px;border:1px solid var(--mc-line);border-radius:16px;background:var(--mc-card);text-align:left;box-shadow:0 7px 20px rgba(7,35,12,.04);transition:transform .18s,border-color .18s,box-shadow .18s}
.mc__l:not([disabled]):hover{transform:translateY(-2px);border-color:rgba(46,125,50,.35);box-shadow:0 13px 28px rgba(7,35,12,.09)}
.mc__lc{position:relative;width:150px;aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:#13321a}
.mc__lc img{width:100%;height:100%;object-fit:cover;display:block}
.mc__lc:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28))}
.mc__lc>b{position:absolute;z-index:1;top:8px;left:8px;min-width:28px;height:24px;display:grid;place-items:center;padding:0 7px;border-radius:7px;border:1px solid rgba(255,255,255,.3);background:rgba(10,20,12,.6);backdrop-filter:blur(8px);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.04em}

<div class="mc solo" id="mi-curso" hidden role="dialog" aria-modal="true" aria-labelledby="mc-titulo">
  <header class="mc__top">
    <div class="mc__brand"><img src="/assets/brand/logo-vp-300.png" alt="" width="34" height="34" onerror="this.style.display='none'"><div><b id="mc-titulo">Mi curso</b><small><span class="mc__hide-sm">Visión Pecuaria · </span>Aula del curso</small></div></div>
    <button type="button" class="mc__me" id="mc-me" aria-label="Mi cuenta" hidden></button>
    <button type="button" class="mc__x" id="mc-cerrar" aria-label="Volver a la página del curso"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg><span>Volver</span></button>

</div>

<script type="module">
// ═══════════════════════════════════════════════════════════════════════════
// «Ya compré · Entrar a mi curso» — aula del curso dentro de la propia landing.
// Navegación tipo panel (estilo ICADEM): barra lateral en escritorio, cápsula flotante
// con 4 pestañas en teléfono (Inicio · Clases · Materiales · Certificado); Cuenta va en el perfil.
// · Identidad: Firebase Auth (proyecto visionpecuaria-vip, el mismo del checkout).
// · Derechos y contenido: backend /alumno/* (verifica la compra; correo verificado).
// · Si la cuenta no compró el curso → lo manda al pago de esta misma landing.
// ═══════════════════════════════════════════════════════════════════════════
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification,
  signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

const API = 'https://visionpecuaria-webhook-production.up.railway.app';
const SLUG = document.body.dataset.slug;
const CFG = { apiKey: "AIzaSyDQXkIo-BWPIeLZzHeTMN986WMDn0TrTJU", authDomain: "visionpecuaria-vip.firebaseapp.com", projectId: "visionpecuaria-vip",
  storageBucket: "visionpecuaria-vip.firebasestorage.app", messagingSenderId: "978318807782", appId: "1:978318807782:web:626e67bb30795c15b02127" };
const NOMBRES = { 'gallinas-de-postura': 'Gallinas de Postura', 'embutidos-artesanales': 'Embutidos Artesanales' };
const PORTADA = document.querySelector('video[poster]')?.getAttribute('poster') || document.querySelector('meta[property="og:image"]')?.content || '';
const WA = 'https://wa.me/522361049715';

const app = getApps().length ? getApps()[0] : initializeApp(CFG);
const auth = getAuth(app); auth.languageCode = 'es';
setPersistence(auth, browserLocalPersistence).catch(() => {});
getRedirectResult(auth).catch(() => {});

const $ = (s) => document.querySelector(s);
const root = $('#mi-curso'), view = $('#mc-view');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const I = {
  casa: '<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>',
  clases: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>',
  doc: '<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  cert: '<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="m8.5 13-1.5 8 5-3 5 3-1.5-8"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>', check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  reloj: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  atras: '<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>', flecha: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  salir: '<svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>',
  vivo: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10"/></svg>',
  wa: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>'
};
const G = '<svg viewBox="0 0 24 24" style="stroke:none"><path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.6 3.8-5.4 3.8-3.2 0-5.9-2.7-5.9-6s2.7-6 5.9-6c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.4 14.6 2.4 12 2.4 6.7 2.4 2.4 6.7 2.4 12s4.3 9.6 9.6 9.6c5.5 0 9.2-3.9 9.2-9.4 0-.6-.1-1.1-.2-1.6H12z"/></svg>';

let USER = null, DATA = null, ABIERTO = false, MODO = 'entrar', SEG = null;

function toast(m, err) { const t = $('#mc-toast'); t.textContent = m; t.className = 'mc__toast on' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = 'mc__toast', 3500); }
async function api(path, opt = {}, otra = true) {
  const tok = auth.currentUser && await auth.currentUser.getIdToken();
  const r = await fetch(API + path, { method: opt.method || 'GET', keepalive: !!opt.keepalive, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: opt.body ? JSON.stringify(opt.body) : undefined });
  let d = null; try { d = await r.json(); } catch (_) {}
  if (r.status === 401 && otra) { await auth.currentUser?.getIdToken(true); return api(path, opt, false); }
  if (!r.ok) throw Object.assign(new Error((d && d.error) || 'Error ' + r.status), { status: r.status });
  return d;
}

// ─── Abrir / cerrar / ir al pago ─────────────────────────────────────────────
function abrir() {
  ABIERTO = true; root.hidden = false; document.documentElement.style.overflow = 'hidden';
  if (!location.hash.startsWith('#mi-curso')) history.pushState({ mc: 1 }, '', '#mi-curso');
  render();
}
async function cerrar(sinHistorial) {
  await detener(); ABIERTO = false; root.hidden = true; document.documentElement.style.overflow = '';
  if (!sinHistorial && location.hash.startsWith('#mi-curso')) history.replaceState(null, '', location.pathname + location.search);
}
function irAlPago() {
  cerrar();
  setTimeout(() => { const b = document.querySelector('[data-action="inscribir"]'); if (b) b.click(); }, 60);
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('a.ya-compre, [data-mi-curso]');
  if (a) { e.preventDefault(); e.stopPropagation(); abrir(); }
}, true);
$('#mc-cerrar').addEventListener('click', () => cerrar());
window.addEventListener('popstate', () => {
  const enCurso = location.hash.startsWith('#mi-curso');
  if (ABIERTO && !enCurso) cerrar(true); else if (!ABIERTO && enCurso) abrir(); else if (ABIERTO) render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && ABIERTO) cerrar(); });

onAuthStateChanged(auth, (u) => { USER = u; DATA = null; if (ABIERTO) render(); });
if (location.hash.startsWith('#mi-curso') || /[?&]mi-curso\b/.test(location.search)) abrir();

// ─── Navegación (sidebar en PC · 4 pestañas en teléfono) ────────────────────
const TABS = [
  { id: 'inicio', t: 'Inicio', lado: 'Inicio', i: 'casa' },
  { id: 'clases', t: 'Clases', lado: 'Mis clases', i: 'clases' },
  { id: 'materiales', t: 'Materiales', lado: 'Materiales', i: 'doc' },
  { id: 'certificado', t: 'Certificado', lado: 'Mi certificado', i: 'cert' }
];
const RUTAS = [...TABS.map(t => t.id), 'cuenta'];
function rutaActual() {
  const h = location.hash;
  let m = h.match(/^#mi-curso\/clase\/(.+)$/); if (m) return { tab: 'clases', clase: decodeURIComponent(m[1]) };
  m = h.match(/^#mi-curso\/([a-z]+)$/); if (m && RUTAS.includes(m[1])) return { tab: m[1] };
  return { tab: 'inicio' };
}
function ir(tab) { history.pushState({ mc: 1 }, '', tab === 'inicio' ? '#mi-curso' : '#mi-curso/' + tab); render(); }
function irClase(id) { history.pushState({ mc: 1 }, '', '#mi-curso/clase/' + encodeURIComponent(id)); render(); }
function pintarNav(activa) {
  const pendCert = certPendienteDeSolicitar();
  $('#mc-side').innerHTML = `
    <div class="mc__glabel">Mi curso</div>
    ${TABS.map(t => `<button type="button" class="mc__ni ${t.id === activa ? 'on' : ''}" data-tab="${t.id}">${I[t.i]}${t.lado}</button>`).join('')}
    <div class="mc__glabel">Mi cuenta</div>
    <button type="button" class="mc__ni ${activa === 'cuenta' ? 'on' : ''}" data-tab="cuenta">${I.user}Mi cuenta</button>
    <a class="mc__ni" href="${WA}?text=${encodeURIComponent('Hola, soy alumno de ' + (NOMBRES[SLUG] || 'un curso') + ' y necesito ayuda')}" target="_blank" rel="noopener">${I.wa}Soporte WhatsApp</a>
    <div class="mc__side-foot"><button type="button" class="mc__ni" id="mc-salir">${I.salir}Cerrar sesión</button></div>`;
  $('#mc-tabs').innerHTML = TABS.map(t => `<button type="button" class="mc__tab ${t.id === activa ? 'on' : ''}" data-tab="${t.id}" ${t.id === activa ? 'aria-current="page"' : ''}>${I[t.i]}${t.t}${t.id === 'certificado' && pendCert && activa !== 'certificado' ? '<span class="dot"></span>' : ''}</button>`).join('');
  const me = $('#mc-me');
  if (me && USER) { me.hidden = false; me.textContent = ((USER.displayName || USER.email || '?').trim()[0] || '?').toUpperCase(); me.classList.toggle('on', activa === 'cuenta'); me.onclick = () => ir('cuenta'); }
  root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => ir(b.dataset.tab));
  const s = $('#mc-salir'); if (s) s.onclick = async () => { await detener(); await signOut(auth); };
}

// ─── Render raíz ────────────────────────────────────────────────────────────
function cargando() { view.innerHTML = '<div class="mc__spin mc__spin--d"></div>'; }

async function render() {
  await detener();
  $('#mc-body').scrollTop = 0;
  $('#mc-me').hidden = true;
  if (!USER) { root.classList.add('solo'); $('#mc-titulo').textContent = 'Mi curso'; return vistaAcceso(); }
  if (!DATA) {
    root.classList.add('solo'); cargando();
    try { DATA = await api('/alumno/curso/' + encodeURIComponent(SLUG)); }
    catch (e) {
      if (e.status === 403) return vistaSinCompra();
      view.innerHTML = `<div class="mc__card mc__empty"><h2>No pudimos cargar tu curso</h2><p>${esc(e.message)}. Revisa tu conexión e intenta de nuevo.</p><div class="mc__acts"><button class="mc__btn mc__btn--p" id="mc-reint">Reintentar</button></div></div>`;
      $('#mc-reint').onclick = render; return;
    }
  }
  root.classList.remove('solo');
  $('#mc-titulo').textContent = DATA.curso.nombre;
  const r = rutaActual();
  pintarNav(r.tab);
  if (r.clase) return vistaClase(r.clase);
  if (r.tab === 'clases') return vistaClases();
  if (r.tab === 'materiales') return vistaMateriales();
  if (r.tab === 'cuenta') return vistaCuenta();
  if (r.tab === 'certificado') return vistaCertificado();
  vistaInicio();
}

// ─── Acceso / sin compra (pantalla sola) ────────────────────────────────────
function vistaAcceso(msg, ok) {
  const crear = MODO === 'crear';
  view.innerHTML = `<div class="mc__card mc__auth">
    <h2>${crear ? 'Crea tu contraseña' : 'Entra a tu curso'}</h2>

    <button type="button" class="mc__btn mc__btn--google" id="mc-google">${G} Continuar con Google</button>
    <div class="mc__sep">o con correo y contraseña</div>
    <form id="mc-form" novalidate>
      <label class="mc__field">Correo<input type="email" id="mc-email" autocomplete="email" inputmode="email" required></label>
      <label class="mc__field">Contraseña<input type="password" id="mc-pass" autocomplete="${crear ? 'new-password' : 'current-password'}" minlength="6" required></label>
      ${msg ? `<p class="mc__msg ${ok ? 'ok' : ''}" role="alert">${esc(msg)}</p>` : ''}

    <p class="mc__help">¿Todavía no compras el curso? <button type="button" class="mc__link" id="mc-comprar">Inscríbete aquí</button></p>
  </div>`;
  $('#mc-google').onclick = async () => {
    try { const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' }); await signInWithPopup(auth, p); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return signInWithRedirect(auth, new GoogleAuthProvider());
      if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') vistaAcceso('No pudimos iniciar sesión con Google. Intenta de nuevo.');
    }
  };

    ev.preventDefault();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return vistaAcceso('Escribe un correo válido.');
    if (pass.length < 6) return vistaAcceso('La contraseña debe tener al menos 6 caracteres.');
    $('#mc-enviar').disabled = true;
    try {
      if (crear) { const c = await createUserWithEmailAndPassword(auth, email, pass); await sendEmailVerification(c.user).catch(() => {}); }
      else await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      const c = e && e.code || '';
      vistaAcceso(c === 'auth/too-many-requests' ? 'Demasiados intentos. Espera unos minutos.' : c === 'auth/email-already-in-use' ? 'No pudimos crear la cuenta. Si ya tienes una, entra o restablece tu contraseña.' : 'No pudimos iniciar sesión. Revisa tus datos o restablece tu contraseña.');
    }
  };
  $('#mc-modo').onclick = () => { MODO = crear ? 'entrar' : 'crear'; vistaAcceso(); };
  $('#mc-reset').onclick = async () => {
    const email = $('#mc-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return vistaAcceso('Escribe tu correo y vuelve a tocar «Olvidé mi contraseña».');
    try { await sendPasswordResetEmail(auth, email); } catch (_) {}
    vistaAcceso('Si ese correo tiene una cuenta, te enviamos un enlace para crear una nueva contraseña.', true);
  };
  $('#mc-comprar').onclick = irAlPago;
}

// ─── Utilidades de contenido ────────────────────────────────────────────────
const fecha = (iso) => { try { return new Date(iso).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (_) { return ''; } };
const fb = `onerror="this.onerror=null;this.src='${esc(PORTADA)}'"`;
const siguiente = () => { const p = DATA.progreso; return p.ultimaClaseId && !(p.clases?.[p.ultimaClaseId]?.completada) ? p.ultimaClaseId : (DATA.clases.find(c => c.estado === 'publicada' && !p.clases?.[c.id]?.completada) || DATA.clases.find(c => c.estado === 'publicada') || {}).id; };
function certPendienteDeSolicitar() { return DATA && (DATA.certificado?.estado !== 'emitido') && !DATA.solicitudCertificado; }
function estadoCertTexto() {
  const ce = DATA.certificado || {}, so = DATA.solicitudCertificado;
  if (ce.estado === 'emitido') return 'Emitido';
  if (so) return ({ pendiente: 'Solicitado', en_proceso: 'En proceso', emitido: 'Emitido', rechazado: 'Revisión' })[so.estado] || 'Solicitado';
  return 'Sin solicitar';
}
const PLAY_ICO = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
function filaClase(cl, i, d, sig) {
  const pc = d.progreso.clases?.[cl.id] || {}; const pub = cl.estado === 'publicada';
  const cls = ['mc__l', pc.completada ? 'vista' : '', cl.id === sig && !pc.completada && pub ? 'sig' : ''].join(' ');
  const etiqueta = pc.completada ? 'Vista' : !pub ? 'Grabación pendiente' : cl.id === sig ? 'Tu siguiente clase' : 'Clase ' + String(i + 1).padStart(2, '0');
  return `<button type="button" class="${cls}" ${pub ? `data-clase="${esc(cl.id)}"` : 'disabled'}>
    <span class="mc__lc"><img src="${esc(cl.miniatura || d.curso.portada || PORTADA)}" alt="" loading="lazy" ${fb}><b>${String(i + 1).padStart(2, '0')}</b><i>${pc.completada ? I.check : pub ? PLAY_ICO : I.lock}</i></span>
    <span class="mc__lt"><em>${etiqueta}</em><strong>${esc(cl.titulo)}</strong><small>${pub ? (cl.duracionMin ? cl.duracionMin + ' min · Grabación' : 'Grabación') : 'Se publica muy pronto'}</small></span>
    <span class="mc__la">${pub ? I.flecha : I.lock}</span>
  </button>`;
}
function ctaCertificado() {
  if (!certPendienteDeSolicitar()) return '';
  return `<button type="button" class="mc__cta-cert" data-ir="certificado"><i>${I.cert}</i><span><b>Solicitar mi certificado</b><small>Déjanos tus datos para emitirlo con QR y folio</small></span>${I.flecha}</button>`;
}
function panelActividad() {
  const d = DATA, p = d.progreso, ce = d.certificado || { estado: 'pendiente' };
  return `<div class="mc__card mc__panel"><h3>Tu actividad</h3>
    <div class="mc__ring" style="--p:${p.porcentaje}"><div>${p.porcentaje}%<small>${p.completadas}/${p.total}</small></div></div>
    <div class="mc__rowstat"><span>Clases vistas</span><b>${p.completadas} / ${p.total}</b></div>
    <div class="mc__rowstat"><span>Materiales</span><b>${d.materiales.filter(m => m.disponible).length}</b></div>
    <div class="mc__rowstat"><span>Certificado</span><span class="mc__chip ${ce.estado === 'emitido' ? 'mc__chip--ok' : 'mc__chip--pend'}">${estadoCertTexto()}</span></div>
  </div>
  <div class="mc__card mc__wa"><b>¿Dudas con tu curso?</b><p>Escríbenos y te ayudamos en minutos.</p>
    <a class="mc__btn mc__btn--p mc__btn--sm" href="${WA}?text=${encodeURIComponent('Hola, soy alumno de ' + (NOMBRES[SLUG] || 'un curso') + ' y tengo una duda')}" target="_blank" rel="noopener">${I.wa} WhatsApp directo</a></div>`;
}
function ligarVista() {
  view.querySelectorAll('[data-clase]').forEach(b => b.onclick = () => irClase(b.dataset.clase));
  view.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => ir(b.dataset.ir));
  view.querySelectorAll('[data-mat]').forEach(b => b.onclick = async () => {
    const w = window.open('', '_blank');
    try { const r = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/material', { method: 'POST', body: { materialId: b.dataset.mat } });
      if (w) { w.opener = null; w.location.href = r.url; } else location.href = r.url; }

  function vistaCertificadoErr(m) {
    const vals = { n: $('#cf-nombre')?.value, w: $('#cf-wa')?.value, e: $('#cf-estado')?.value, c: $('#cf-ciudad')?.value, o: $('#cf-ocup')?.value, t: $('#cf-com')?.value };
    vistaCertificado(m);
    if (vals.n != null) { $('#cf-nombre').value = vals.n; $('#cf-wa').value = vals.w; $('#cf-estado').value = vals.e; $('#cf-ciudad').value = vals.c; $('#cf-ocup').value = vals.o; $('#cf-com').value = vals.t; }
  }
}

// ─── Cuenta ─────────────────────────────────────────────────────────────────
function vistaCuenta() {
  const u = USER, d = DATA, ce = d.certificado || { estado: 'pendiente' };
  const prov = (u.providerData || []).map(p => p.providerId === 'google.com' ? 'Google' : p.providerId === 'password' ? 'Correo y contraseña' : p.providerId).join(', ') || '—';
  view.innerHTML = `<span class="mc__eyebrow">Tu acceso</span>
  <div class="mc__sech" style="margin-top:4px"><h2 class="mc__h">Mi cuenta</h2></div>
  <div class="mc__card mc__cuenta"><dl>
    <dt>Correo</dt><dd>${esc(u.email || '—')}</dd>
    <dt>Forma de entrar</dt><dd>${esc(prov)}</dd>
    <dt>Curso</dt><dd>${esc(d.curso.nombre)}</dd>
    <dt>Adquirido</dt><dd>${d.acceso?.fechaCompra ? esc(fecha(d.acceso.fechaCompra)) : '—'}</dd>
  </dl></div>
  <div class="mc__sec mc__card mc__cert"><div><span class="mc__chip ${ce.estado === 'emitido' ? 'mc__chip--ok' : 'mc__chip--pend'}">${I.cert} Certificado: ${estadoCertTexto()}</span>
    <p>${ce.estado === 'emitido' ? `Folio <b>${esc(ce.folio || '')}</b>, con QR verificable.` : 'Solicítalo con tus datos y te lo enviamos por correo.'}</p></div>
    <button type="button" class="mc__btn mc__btn--p mc__btn--sm" data-ir="certificado">${ce.estado === 'emitido' ? 'Ver certificado' : 'Ir a mi certificado'}</button></div>
  <div class="mc__sec mc__card mc__cert"><div><b>¿Necesitas ayuda?</b><p>Compras, facturas, acceso o cualquier duda del curso.</p></div>
    <a class="mc__btn mc__btn--l mc__btn--sm" href="${WA}?text=${encodeURIComponent('Hola, soy alumno de ' + (NOMBRES[SLUG] || 'un curso') + ' y necesito ayuda')}" target="_blank" rel="noopener">${I.wa} WhatsApp</a></div>
  <div class="mc__sec" style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="mc__btn mc__btn--l" id="mc-salir2">${I.salir} Cerrar sesión</button>
    <button class="mc__btn mc__btn--l" id="mc-volver2">Volver a la página del curso</button>
  </div>`;
  $('#mc-salir2').onclick = async () => { await detener(); await signOut(auth); };
  $('#mc-volver2').onclick = () => cerrar();
  ligarVista();
}

// ─── Clase (reproductor) ────────────────────────────────────────────────────
async function vistaClase(id) {
  const d = DATA, idx = d.clases.findIndex(c => c.id === id), cl = d.clases[idx];
  if (!cl || cl.estado !== 'publicada') { history.replaceState({ mc: 1 }, '', '#mi-curso/clases'); return vistaClases(); }
  const pubs = d.clases.filter(c => c.estado === 'publicada'), k = pubs.findIndex(c => c.id === id);
  const prev = pubs[k - 1], next = pubs[k + 1], pc = (d.progreso.clases || {})[id] || {};
  const mats = d.materiales.filter(m => m.disponible && (m.claseId === id || (cl.materialesIds || []).includes(m.id)));
  view.innerHTML = `<button type="button" class="mc__link" data-ir="clases" style="display:inline-flex;gap:6px;align-items:center;margin-bottom:14px">${I.atras} Volver al temario</button>
  <div class="mc__pl"><div>
    <div class="mc__player" id="mc-player"><div class="mc__pst"><div class="mc__spin"></div><span>Preparando la clase…</span></div></div>
    <div class="mc__lh"><div><small>Clase ${idx + 1} de ${d.clases.length}</small><h1>${esc(cl.titulo)}</h1></div>
      <span class="mc__chip ${pc.completada ? 'mc__chip--ok' : ''}" id="mc-chip">${pc.completada ? I.check + ' Vista' : (cl.duracionMin ? I.reloj + ' ' + cl.duracionMin + ' min' : 'En curso')}</span></div>
    <div class="mc__nav">
      ${prev ? `<button class="mc__btn mc__btn--l" data-clase="${esc(prev.id)}">${I.atras} Anterior</button>` : ''}
      <button class="mc__btn ${pc.completada ? 'mc__btn--l' : 'mc__btn--g'}" id="mc-vista" ${pc.completada ? 'disabled' : ''}>${I.check} ${pc.completada ? 'Clase vista' : 'Marcar como vista'}</button>
      ${next ? `<button class="mc__btn mc__btn--p" data-clase="${esc(next.id)}">Siguiente ${I.flecha}</button>` : ''}
    </div>
    ${cl.descripcion ? `<p style="margin-top:16px;color:var(--mc-soft);line-height:1.6">${esc(cl.descripcion)}</p>` : ''}
    ${next ? `<div class="mc__sec"><div class="mc__sech"><h2>A continuación</h2></div>
      <button type="button" class="mc__card mc__next" style="width:100%" data-clase="${esc(next.id)}">
        <img src="${esc(next.miniatura || d.curso.portada || PORTADA)}" alt="" ${fb}>
        <span style="min-width:0;text-align:left"><span class="mc__eyebrow">Clase ${d.clases.indexOf(next) + 1}</span><b>${esc(next.titulo)}</b><small>${next.duracionMin ? next.duracionMin + ' min' : 'Grabación'}</small></span>
        <span class="mc__go" style="margin-left:auto">${I.flecha}</span></button></div>` : ''}
    ${mats.length ? `<div class="mc__sec"><div class="mc__sech"><h2>Materiales de esta clase</h2></div><div class="mc__mats">${mats.map(mat).join('')}</div></div>` : ''}
  </div>
  <aside class="mc__card mc__list" aria-label="Clases del curso"><h3>${esc(d.curso.nombre)}</h3><p>${d.progreso.completadas} de ${d.progreso.total} clases vistas</p>
    ${d.clases.map((x, i) => { const v = ((d.progreso.clases || {})[x.id] || {}).completada, pb = x.estado === 'publicada';
      return `<button class="mc__li ${x.id === id ? 'on' : ''} ${v ? 'vista' : ''}" ${pb ? `data-clase="${esc(x.id)}"` : 'disabled'}><span>${v ? I.check : i + 1}</span><span>${esc(x.titulo)}<small>${pb ? (x.duracionMin ? x.duracionMin + ' min' : 'Grabación') : 'Grabación pendiente de publicación'}</small></span></button>`; }).join('')}
  </aside></div>`;
  ligarVista();
  $('#mc-vista').onclick = () => guardar(true, true);
  SEG = { id, base: Number(pc.segundos) || 0, ses: 0, env: 0, comp: !!pc.completada, pos: Number(pc.posicion) || 0, dur: cl.duracionMin, video: null, t: null };
  try {
    const src = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/video', { method: 'POST', body: { claseId: id } });
    const pl = $('#mc-player'); if (!pl || !SEG || SEG.id !== id) return;
    if (src.tipo === 'video') {
      const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.setAttribute('controlsList', 'nodownload'); v.src = src.url;
      v.addEventListener('loadedmetadata', () => { if (SEG && SEG.pos > 5 && SEG.pos < v.duration - 10) v.currentTime = SEG.pos; });
      v.addEventListener('ended', () => guardar(true));
      pl.innerHTML = ''; pl.appendChild(v); SEG.video = v;
    } else pl.innerHTML = `<iframe src="${esc(src.url)}" title="${esc(cl.titulo)}" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    SEG.t = setInterval(() => {
      if (!SEG || document.hidden || (SEG.video && SEG.video.paused)) return;
      SEG.ses++; if (SEG.video) SEG.pos = Math.floor(SEG.video.currentTime || 0);
      if (!SEG.comp && !SEG.video && SEG.dur && SEG.base + SEG.ses >= SEG.dur * 48) guardar(true);
      if (SEG.ses - SEG.env >= 20) guardar(false);
    }, 1000);
  } catch (e) {
    const pl = $('#mc-player'); if (pl) pl.innerHTML = `<div class="mc__pst">${I.lock}<b>${esc(e.message || 'No pudimos abrir el video')}</b></div>`;
  }
}

async function guardar(comp, avisar) {
  if (!SEG) return; const s = SEG; s.env = s.ses; if (comp) s.comp = true;
  try {
    const r = await api('/alumno/curso/' + encodeURIComponent(SLUG) + '/progreso', { method: 'POST', keepalive: true, body: { claseId: s.id, segundos: s.base + s.ses, completada: s.comp, posicion: s.pos, clientTs: Date.now() } });
    if (DATA && r.progreso) DATA.progreso = r.progreso;
    if (comp && SEG === s) { const b = $('#mc-vista'); if (b) { b.disabled = true; b.className = 'mc__btn mc__btn--l'; b.innerHTML = I.check + ' Clase vista'; }
      const ch = $('#mc-chip'); if (ch) { ch.className = 'mc__chip mc__chip--ok'; ch.innerHTML = I.check + ' Vista'; } if (avisar) toast('Clase marcada como vista'); }
  } catch (_) { if (avisar) toast('No pudimos guardar tu progreso', true); }
}
async function detener() {
  if (!SEG) return; clearInterval(SEG.t); const s = SEG;
  if (s.ses > s.env) await guardar(false);
  if (s.video) try { s.video.pause(); } catch (_) {}
  SEG = null;
}
document.addEventListener('visibilitychange', () => { if (document.hidden && SEG && SEG.ses > SEG.env) guardar(false); });
window.addEventListener('pagehide', () => { if (SEG && SEG.ses > SEG.env) guardar(false); });
</script>

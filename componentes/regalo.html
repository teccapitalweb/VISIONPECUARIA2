<style id="vp-regalo-css">
#vp-regalo{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,18,.62);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
#vp-regalo.on{display:flex;animation:vprg-f .2s ease}
#vp-regalo .vprg{position:relative;width:100%;max-width:400px;max-height:calc(100dvh - 32px);overflow:auto;border-radius:18px;background:#fff;color:#16211a;text-align:left;box-shadow:0 24px 60px -18px rgba(0,0,0,.55);animation:vprg-p .28s ease}
#vp-regalo .vprg__x{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#16211a;font-size:19px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#vp-regalo .vprg__img{position:relative;height:168px;background:#1d3b25 center/cover no-repeat}
#vp-regalo .vprg__img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.5) 100%)}
#vp-regalo .vprg__tag{position:absolute;left:16px;bottom:14px;z-index:1;padding:5px 10px;border-radius:6px;background:#fff;color:#14532d;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
#vp-regalo .vprg__b{padding:20px 22px 20px}
#vp-regalo .vprg__k{margin:0 0 6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b45309}
#vp-regalo h3{margin:0 0 8px;font-family:'Archivo','Inter',system-ui,sans-serif;font-size:23px;line-height:1.15;font-weight:800;letter-spacing:-.01em;color:#16211a}
#vp-regalo p.vprg__t{margin:0;font-size:14.5px;line-height:1.5;color:#4b5a50}
#vp-regalo .vprg__r{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 0;padding:12px 14px;border-radius:12px;background:#f4f6f1;border:1px solid #e3e8df}
#vp-regalo .vprg__r span{font-size:13px;line-height:1.3;color:#4b5a50}
#vp-regalo .vprg__r b{font-family:'Archivo','Inter',system-ui,sans-serif;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:#16211a;white-space:nowrap}
#vp-regalo .vprg__cta{display:block;width:100%;margin-top:16px;padding:16px;border:0;border-radius:12px;cursor:pointer;font-family:'Archivo','Inter',system-ui,sans-serif;font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#166534;box-shadow:0 10px 22px -10px rgba(22,101,52,.8);transition:background .15s,transform .15s}
#vp-regalo .vprg__cta:hover{background:#14532d;transform:translateY(-1px)}
#vp-regalo .vprg__no{display:block;margin:12px auto 0;background:none;border:0;color:#6b7a70;font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
[data-vp-regalo-promesa][hidden]{display:none!important}
/* Cinta de la oferta activada. */
#vp-gano{position:fixed;top:0;left:0;right:0;z-index:2147482000;display:none;align-items:center;justify-content:center;gap:10px 16px;flex-wrap:wrap;padding:9px 14px;background:#14532d;color:#fff;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;line-height:1.35;text-align:center;box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
html.vp-gano #vp-gano{display:flex}
html.vp-gano body{padding-top:var(--vp-gano-h,56px)}
html.vp-gano .hdr{top:var(--vp-gano-h,56px)}
#vp-gano b{font-weight:800}
#vp-gano .vpg__r{font-variant-numeric:tabular-nums;font-weight:800;color:#fde68a;white-space:nowrap}
#vp-gano .vpg__btn{flex:none;padding:8px 14px;border:0;border-radius:999px;background:#fff;color:#14532d;font:inherit;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
@keyframes vprg-f{from{opacity:0}to{opacity:1}}
@keyframes vprg-p{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#vp-regalo,#vp-regalo *{animation:none!important;transition:none!important}}
</style>
<div id="vp-gano">
  <span><b>Sexaje Avícola de regalo.</b> Completa tu pago en <span class="vpg__r" id="vpg-reloj" role="timer"></span>.</span>
  <button type="button" class="vpg__btn" data-action="inscribir">Inscribirme</button>
</div>
<div id="vp-regalo" role="dialog" aria-modal="true" aria-labelledby="vprg-h" hidden>
  <div class="vprg">
    <button type="button" class="vprg__x" data-vprg-cerrar aria-label="Cerrar">&times;</button>
    <div class="vprg__img" id="vprg-img"><span class="vprg__tag">Curso de regalo</span></div>
    <div class="vprg__b">
      <p class="vprg__k">Oferta por tiempo limitado</p>
      <h3 id="vprg-h">Llévate gratis el Curso de Sexaje Avícola</h3>
      <p class="vprg__t">Paga <b id="vprg-curso">este curso</b> antes de que termine el contador. Sexaje Avícola aparecerá en tu aula.</p>
      <div class="vprg__r"><span>Tiempo restante</span><b id="vprg-reloj" role="timer"></b></div>
      <button type="button" class="vprg__cta" id="vprg-cta">Quiero mi lugar</button>
      <button type="button" class="vprg__no" data-vprg-cerrar>Ahora no</button>
    </div>
  </div>
</div>
<script>
(() => {
  const API = 'https://visionpecuaria-webhook-production.up.railway.app';
  const nombres = { 'gallinas-de-postura': 'Manejo de Gallinas de Postura', 'embutidos-artesanales': 'Embutidos Artesanales' };
  const slug = document.body.dataset.slug || (location.pathname.split('/').filter(Boolean).pop() || '').replace(/\.html$/, '');
  const caja = document.getElementById('vp-regalo');
  const cinta = document.getElementById('vp-gano');
  const cta = document.getElementById('vprg-cta');
  if (!nombres[slug] || !caja || !cinta || !cta) return;

  const raiz = document.documentElement;
  const promesas = document.querySelectorAll('[data-vp-regalo-promesa]');
  const relojes = [document.getElementById('vprg-reloj'), document.getElementById('vpg-reloj')];
  const claveNavegador = 'vp_regalo_navegador_v1';
  const claveReclamo = 'vp_regalo_reclamo_v1_' + slug;
  const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
  let navegadorId, reserva = null, rechazo = false, reclamo = leerReclamo();
  let consultandoReserva = null;
  let listo = false, intentoHecho = false, popupMostrado = false, tic = null, desborde = '', focoAnterior = null;

  function leer(clave) { try { return localStorage.getItem(clave); } catch (_) { return null; } }
  function escribir(clave, valor) { try { localStorage.setItem(clave, valor); } catch (_) {} }

  function leerReclamo() {
    try {
      const dato = JSON.parse(leer(claveReclamo));
      return dato && uuid.test(dato.navegadorId) && typeof dato.token === 'string' && dato.token &&
        Number.isFinite(dato.venceEn) && Number.isFinite(dato.desfase) ? dato : null;
    } catch (_) { return null; }
  }

  function idNavegador() {
    if (navegadorId) return navegadorId;
    const guardado = leer(claveNavegador);
    navegadorId = reclamo?.navegadorId || (uuid.test(guardado) ? guardado : window.crypto?.randomUUID?.());
    if (navegadorId) escribir(claveNavegador, navegadorId);
    return navegadorId;
  }

  function enLanding() {
    if (new URLSearchParams(location.search).get('pago') === 'ok' || location.hash.startsWith('#mi-curso')) return false;
    const aula = document.getElementById('mi-curso');
    const pago = document.getElementById('modal-checkout');
    return !(aula && !aula.hidden) && !(pago && (pago.hasAttribute('data-open') ||
      /(^| )(open|is-open|active|show)( |$)/.test(pago.className)));
  }

  function restante(dato) {
    if (!dato) return 0;
    const porReloj = dato.venceEn - Date.now() - dato.desfase;
    const porTiempo = dato.limiteMonotono === undefined ? porReloj : dato.limiteMonotono - performance.now();
    return Math.max(0, Math.min(porReloj, porTiempo));
  }

  async function apartar(id, reclamar = false) {
    const controlador = new AbortController();
    const limite = setTimeout(() => controlador.abort(), 4500);
    const desde = performance.now();
    try {
      const resp = await fetch(API + '/publico/cursos/regalo/apartar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
        body: JSON.stringify({ cursoSlug: slug, navegadorId: id, ...(reclamar ? { reclamar } : {}) }), signal: controlador.signal
      });
      if (id !== navegadorId) return null;
      if (!resp.ok) {
        rechazo = resp.status >= 400 && resp.status < 500 && resp.status !== 408 && resp.status !== 429;
        return null;
      }
      const dato = await resp.json();
      const venceEn = Date.parse(dato.venceEn);
      const ahora = Date.parse(dato.ahora);
      if (dato.cursoRegaloSlug !== 'sexaje-avicola' || typeof dato.token !== 'string' || !dato.token ||
          !Number.isFinite(venceEn) || !Number.isFinite(ahora) || id !== navegadorId) return null;
      rechazo = false;
      return {
        token: dato.token, navegadorId: id, venceEn, reclamada: dato.reclamada === true,
        desfase: ahora + performance.now() - desde - Date.now(),
        limiteMonotono: desde + venceEn - ahora
      };
    } catch (_) {
      return null;
    } finally {
      clearTimeout(limite);
    }
  }

  function guardarReclamo() {
    const { token, navegadorId, venceEn, desfase } = reserva;
    reclamo = { token, navegadorId, venceEn, desfase };
    escribir(claveReclamo, JSON.stringify(reclamo));
  }

  function ajustarAltura() {
    raiz.style.setProperty('--vp-gano-h', cinta.offsetHeight + 'px');
  }

  function cerrar() {
    if (caja.hidden) return;
    caja.classList.remove('on');
    caja.hidden = true;
    if (raiz.style.overflow === 'hidden') raiz.style.overflow = desborde;
    if (enLanding()) focoAnterior?.focus({ preventScroll: true });
  }

  function pintar() {
    const ms = restante(reserva);
    const reclamado = ms > 0 && reclamo?.navegadorId === reserva.navegadorId;
    const viendoLanding = enLanding();
    const mostrar = ms > 0 && viendoLanding && (reclamado || (popupMostrado && caja.hidden));
    const cambioCinta = raiz.classList.contains('vp-gano') !== mostrar;
    raiz.classList.toggle('vp-gano', mostrar);
    for (const promesa of promesas) promesa.hidden = !mostrar;
    if (!ms || !viendoLanding || reclamado) cerrar();
    clearTimeout(tic);
    tic = null;
    if (!ms) return;
    const total = Math.ceil(ms / 1000);
    const reloj = String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
    for (const nodo of relojes) nodo.textContent = reloj;
    if (mostrar && cambioCinta) ajustarAltura();
    tic = setTimeout(pintar, Math.min(1000, ms));
  }

  async function presentar() {
    if (!listo || !enLanding() || document.visibilityState === 'hidden') return;
    if (!intentoHecho) {
      const id = idNavegador();
      if (!id) return;
      intentoHecho = true;
      consultandoReserva = apartar(id);
      const nueva = await consultandoReserva;
      if (id !== navegadorId) return;
      reserva = nueva;
      if (reserva && (reserva.reclamada || reclamo?.navegadorId === navegadorId)) guardarReclamo();
      pintar();
    }
    if (popupMostrado || !restante(reserva) || reclamo || !enLanding() || document.visibilityState === 'hidden') return;
    popupMostrado = true;
    document.getElementById('vprg-curso').textContent = nombres[slug];
    document.getElementById('vprg-img').style.backgroundImage = "url('https://cdn.jsdelivr.net/gh/teccapitalweb/VISIONPECUARIA2@main/portadas/gallinas-2.jpg')";
    focoAnterior = document.activeElement;
    desborde = raiz.style.overflow;
    caja.hidden = false;
    caja.classList.add('on');
    raiz.style.overflow = 'hidden';
    cta.focus({ preventScroll: true });
  }
  function confeti(){try{
    if(matchMedia('(prefers-reduced-motion: reduce)').matches||document.getElementById('vp-confeti'))return;
    var c=document.createElement('canvas');c.id='vp-confeti';c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2147483646';document.body.appendChild(c);
    var x=c.getContext('2d'),d=Math.min(window.devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;
    var col=['#f0b429','#166534','#22a05a','#ffffff','#f97316','#fde68a'],P=[];
    for(var i=0;i<150;i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height*.7,vx:(Math.random()-.5)*5*d,vy:(2+Math.random()*4)*d,w:(6+Math.random()*6)*d,h:(5+Math.random()*6)*d,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:col[i%col.length]});
    var t0=performance.now();(function f(t){var k=(t-t0)/4500;x.clearRect(0,0,c.width,c.height);x.globalAlpha=k>.75?Math.max(0,1-(k-.75)*4):1;
      P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.03*d;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
      if(k<1)requestAnimationFrame(f);else c.remove()})(t0);
  }catch(e){}}
  function sincronizar() {
    pintar();
    presentar();
  }

  caja.addEventListener('click', e => {
    if (e.target === caja || e.target.closest('[data-vprg-cerrar]')) {
      cerrar();
      pintar();
    }
  });
  cta.addEventListener('click', () => {
    if (caja.hidden || !restante(reserva) || !enLanding()) return pintar();
    guardarReclamo();
    apartar(reclamo.navegadorId, true);
    pintar();
    confeti();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !caja.hidden) {
      cerrar();
      pintar();
    }
  });
  document.addEventListener('visibilitychange', sincronizar);
  window.addEventListener('hashchange', sincronizar);
  window.addEventListener('pageshow', sincronizar);
  window.addEventListener('online', () => {
    if (!reserva && !rechazo) intentoHecho = false;
    sincronizar();
  });
  window.addEventListener('storage', e => {
    if (e.key !== claveReclamo) return;
    reclamo = leerReclamo();
    if (reclamo && reclamo.navegadorId !== navegadorId) {
      navegadorId = reclamo.navegadorId;
      reserva = null;
      consultandoReserva = null;
      intentoHecho = false;
    }
    sincronizar();
  });
  window.addEventListener('resize', () => { if (raiz.classList.contains('vp-gano')) ajustarAltura(); });

  window.vpRegalo = {
    sincronizar,
    async datosCheckout(cursoSlug = slug) {
      if (cursoSlug !== slug) return {};
      const id = idNavegador();
      if (!id) return {};
      const dato = reserva || await consultandoReserva || reclamo;
      return { navegadorId: id, ...(dato?.navegadorId === id && restante(dato) > 0 ? { reservaRegalo: dato.token } : {}) };
    }
  };
  setTimeout(() => { listo = true; presentar(); }, 1500);
})();
</script>
